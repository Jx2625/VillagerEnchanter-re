modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# Access Transformer
accessTransformer="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
