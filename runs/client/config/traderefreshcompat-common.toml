#无法被刷新的村民职业列表。
#格式: "modid:profession_id"
#默认值: ["villager_enchanter:enchanter"]
#
#常用职业 ID:
#  minecraft:armorer       - 盔甲匠
#  minecraft:toolsmith     - 工具匠
#  minecraft:weaponsmith   - 武器匠
#  minecraft:librarian     - 图书管理员
#  minecraft:cleric        - 牧师
#  minecraft:farmer        - 农民
#  minecraft:fisherman     - 渔夫
#  minecraft:shepherd      - 牧羊人
#  minecraft:butcher       - 屠夫
#  minecraft:leatherworker - 皮匠
#  minecraft:mason         - 石匠
blacklistedProfessions = ["villager_enchanter:enchanters"]
#启用后，已交易过的村民（villagerXp > 0）将无法被刷新，
#玩家需使用其他方式（如附魔刷新书）来刷新其交易。
disableRefreshForTradedVillagers = false
#禁用后，拥有附魔书交易的图书管理员将无法被直接刷新，
#玩家必须使用附魔刷新书来更改附魔书交易。
allowRefreshLibrarianEnchantedBooks = true
